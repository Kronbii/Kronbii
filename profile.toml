# ── the README around the card ──────────────────────────────────────────────
# parts.py draws these in the card's palette, light and dark: a header image
# per section, and a pill per link. It also writes the pill row into README.md
# (between the links markers), so a link only has to be added here. Run:
#
#     python parts.py
[readme]
# The bold line under the card, and the line beneath it (parts.py).
headline = "I build for society"
subline = "Robotics · embedded systems · computer vision"

sections = ["Where I work", "What I build", "What I build with", "Lately", "Open source", "Contributions"]

# The first link is drawn filled, as the main one.
links = [
  { label = "ramikronbi.com", href = "https://ramikronbi.com" },
  { label = "LinkedIn",       href = "https://linkedin.com/in/rami-kronbi" },
  { label = "YouTube",        href = "https://www.youtube.com/@RamiKronbi" },
  { label = "Instagram",      href = "https://instagram.com/ramikronbi" },
  { label = "DEV",            href = "https://dev.to/ramikronbi" },
  { label = "Medium",         href = "https://medium.com/@ramikronbi" },
  { label = "Substack",       href = "https://substack.com/@kronbii" },
  { label = "Email",          href = "mailto:ramykronby@gmail.com" },
]

# The Lately prism (prism.py): commits over the last `prism_days`, to these
# repositories only. Leave prism_include out to draw every public repository
# except those in prism_exclude.
prism_days = 90
prism_include = [
  "Kronbii/rotor-fault-recovery", "Kronbii/road-speed-audit",
  "Kronbii/star-tracker", "Kronbii/360-spherical-stitching", "Kronbii/universal-imu-control-dashboard",
  "Kronbii/fine-crack-tracing", "Kronbii/thermal-super-resolution", "Kronbii/smart-interactive-desk",
  "Kronbii/PID-light-tracker", "Kronbii/easyPID", "Kronbii/autonomous-race-car",
  "Kronbii/CNN-Emotion-Detection", "Kronbii/ROS2-beginner-guide", "betaflight/betaflight",
]
prism_exclude = ["Kronbii/Kronbii"]

