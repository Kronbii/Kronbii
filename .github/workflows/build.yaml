name: README build
on:
  # Once a day, and by hand when a change needs to show up sooner.
  #
  # No push trigger: the card is a function of GitHub's data, not of this
  # repository's contents, so rebuilding it on every commit only spends runs to
  # produce the same output the next scheduled run would. workflow_dispatch
  # covers the case where an edit here does change the card and the wait is
  # unwanted.
  #
  # :37 rather than :00 because GitHub queues scheduled workflows and the top of
  # the hour is its busiest slot -- every run on "0 4" started between 05:03 and
  # 05:41 UTC, an hour or more late. An offset minute is less contended.
  schedule:
    - cron: "37 4 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Get Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: cache/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r cache/requirements.txt
      - name: Update README file
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN || github.token }}
          USER_NAME: Kronbii
          # Empty unless the secret is set, so profile.toml's birthday is used.
          # A literal fallback here would silently shadow the config file.
          BIRTHDAY: ${{ secrets.BIRTHDAY }}
        run: python today.py
      - name: Commit
        run: |-
          git add .
          git diff
          git config --global user.email "github-actions-bot@kronbii.github.io"
          git config --global user.name "Kronbii/GitHub-Actions-Bot"
          git commit -m "Updated README" -a || echo "No changes to commit"
          git push
