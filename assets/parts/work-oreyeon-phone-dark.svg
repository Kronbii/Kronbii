<svg xmlns="http://www.w3.org/2000/svg" width="640" height="424" viewBox="0 0 320 212" font-family="ConsolasFallback,Consolas,Menlo,monospace" role="img" aria-label="Oreyeon, Airside intelligence · Coimbra, Portugal: Embedded Systems, Robotics and Vision Engineer. An airside intelligence company. Its Runway Surface Monitoring System detects, geolocates and reports foreign object debris and pavement damage on airport runways in real time.">
<style>
