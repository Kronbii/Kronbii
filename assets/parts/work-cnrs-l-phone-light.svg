<text x="14" y="178" font-size="12" fill="#3e443e" text-anchor="start" textLength="273.6" lengthAdjust="spacingAndGlyphs">and working under the authority of the</text>
<text x="14" y="194.5" font-size="12" fill="#3e443e" text-anchor="start" textLength="273.6" lengthAdjust="spacingAndGlyphs">President of the Council of Ministers.</text>
<text x="14" y="211" font-size="12" fill="#3e443e" text-anchor="start" textLength="230.4" lengthAdjust="spacingAndGlyphs">It runs the National Centers for</text>
