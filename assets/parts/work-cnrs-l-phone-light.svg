<svg xmlns="http://www.w3.org/2000/svg" width="640" height="685" viewBox="0 0 320 342.5" font-family="ConsolasFallback,Consolas,Menlo,monospace" role="img" aria-label="CNRS-L, National Council for Scientific Research, Lebanon: Research Assistant and Development Engineer. Lebanon's principal public institution for scientific research, founded in 1962 and working under the authority of the President of the Council of Ministers. It runs the National Centers for Geophysics, Marine Sciences, Remote Sensing, and Natural Hazards and Early Warning, and the Lebanese Atomic Energy Commission, and is Lebanon's contact point for EU research programmes, with partners including the European Commission, ESA and NASA.">
<style>
text { white-space: pre; }
.fm { animation: fm 9s ease-in-out -3s infinite; }
.fg { animation: fg 9s ease-in-out -3s infinite; }
@keyframes fm { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(-1.4px); } }
@keyframes fg { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(1.4px); } }
@media (prefers-reduced-motion: reduce) { .fm, .fg { animation: none; } }
</style>
