<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" font-family="ConsolasFallback,Consolas,monospace" width="985px" height="530px" font-size="16px">
<style>
@font-face {
src: local('Consolas'), local('Consolas Bold');
font-family: 'ConsolasFallback';
font-display: swap;
-webkit-size-adjust: 109%;
size-adjust: 109%;
}
.key {fill: #b7d3a8;}
.value {fill: #eef1ec;}
.em {fill: #b7d3a8; font-weight: 700;}
.addColor {fill: #a6e68f;}
.delColor {fill: #e08fd0;}
.cc {fill: #343b35;}
text, tspan {white-space: pre;}
.fringe {mix-blend-mode: screen; opacity: .9;}
.fm {transform: translateX(-.9px); animation: fmIn 2.55s cubic-bezier(.2,.7,.2,1) both, fm 9s ease-in-out 2.55s infinite;}
.fg {transform: translateX(.9px); animation: fgIn 2.55s cubic-bezier(.2,.7,.2,1) both, fg 9s ease-in-out 2.55s infinite;}
@keyframes fmIn {0%, 45% {transform: translateX(-5px);} 100% {transform: translateX(-.7px);}}
@keyframes fgIn {0%, 45% {transform: translateX(5px);} 100% {transform: translateX(.7px);}}
@keyframes fm {0%, 100% {transform: translateX(-.7px);} 50% {transform: translateX(-2.1px);}}
@keyframes fg {0%, 100% {transform: translateX(.7px);} 50% {transform: translateX(2.1px);}}

.boot {transform-box: fill-box;}
.shutter {transform-origin: 50% 100%; animation: shutter 1.5s linear 0.15s both;}
.readout {animation: readout 1.5s linear 0.15s both;}
.type {transform-origin: 100% 50%; animation: type 0.3s steps(16, end) both;}
.mk {animation: mk 2.55s ease-out both;}
@keyframes shutter {from {transform: scaleY(1);} to {transform: scaleY(0);}}
@keyframes readout {0% {transform: translateY(0); opacity: 1;} 88% {opacity: 1;} 100% {transform: translateY(518px); opacity: 0;}}
@keyframes type {from {transform: scaleX(1);} to {transform: scaleX(0);}}
@keyframes mk {0%, 70% {opacity: 0;} 100% {opacity: 1;}}
/* the whole boot lasts 1.97s */
@media (prefers-reduced-motion: reduce) {.fm, .fg, .boot, .readout, .mk {animation: none;}}
</style>
